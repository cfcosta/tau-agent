# Tests do not sync their throwaway repositories to disk: see
# scripts/no-disk-syncs.sh. Setup scripts are still experimental in
# nextest.
experimental = ["setup-scripts"]

[scripts.setup.no-disk-syncs]
command = "scripts/no-disk-syncs.sh"

[[profile.default.scripts]]
filter = "all()"
setup = "no-disk-syncs"

# The state-machine model tests: the slowest half of the suite, run by the
# Nightly tier rather than on every push (docs/reference/testing.md, "CI
# tiers"). `ci` leaves them out; `models` runs only them. Keep the two
# filters each other's opposite.
[profile.ci]
default-filter = """
not (test(/(^|::)[a-z0-9_]*_model::/)
  | (package(tau-vcs-host) & binary(=tests) & test(/^model::/)))
"""

[profile.models]
default-filter = """
test(/(^|::)[a-z0-9_]*_model::/)
  | (package(tau-vcs-host) & binary(=tests) & test(/^model::/))
"""
