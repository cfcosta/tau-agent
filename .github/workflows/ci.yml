# The Check tier from docs/reference/testing.md: every push and pull
# request. Everything runs in the flake's dev shell, so CI uses the
# same toolchain and tools as a developer machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: nix fmt -- --ci

      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      # What a phone builds: the interface, and the plugins without their
      # host halves.
      - name: Clippy without the plugins' host halves
        run: |
          nix develop -c cargo clippy -p tau-ui-remote --all-targets -- -D warnings
          for plugin in tau-ask tau-codemode tau-mcp tau-tools tau-vcs; do
            nix develop -c cargo clippy -p "$plugin" --no-default-features --lib -- -D warnings
          done

      - name: Tests
        run: nix develop -c cargo nextest run --workspace

      - name: sqlx offline metadata is current
        working-directory: crates/tau-store-sqlite
        run: |
          export DATABASE_URL="sqlite://$RUNNER_TEMP/tau-store-ci.db"
          nix develop -c sqlx database setup
          nix develop -c cargo sqlx prepare --check -- -p tau-store-sqlite

      # A plugin's own database: its queries are checked against tau's
      # schema and its own, since its tests compile tau-store-sqlite's too.
      - name: sqlx offline metadata is current (tau-constitution)
        working-directory: crates/plugins/tau-constitution
        run: |
          export DATABASE_URL="sqlite://$RUNNER_TEMP/tau-constitution-ci.db"
          nix develop -c sqlx database setup --source ../../tau-store-sqlite/migrations
          nix develop -c sqlx migrate run --ignore-missing --source migrations
          nix develop -c cargo sqlx prepare --check

      - name: Dependencies (advisories, bans, licenses, sources)
        run: nix develop -c cargo deny check
