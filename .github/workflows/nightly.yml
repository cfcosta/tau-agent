# The Nightly tier from docs/reference/testing.md: the extended
# property variants. Mutation testing runs by hand
# (scripts/mutants.sh): a full pass is about eight runner-hours.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  extended:
    name: Extended properties
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - uses: Swatinem/rust-cache@v2
      # In release, as in CI: debug test binaries fill the runner's disk.
      # The tests that ask the real Jev (`the_real_jev_*`) need
      # TYPESAFE_API_KEY, and run by hand.
      - run: >-
          nix develop -c cargo nextest run --release --workspace
          --run-ignored only --no-fail-fast -E 'not test(/^the_real_jev_/)'
