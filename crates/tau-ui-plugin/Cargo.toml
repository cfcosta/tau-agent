[package]
name = "tau-ui-plugin"
description = "The interface a tau plugin brings its UI through (ADR 0017): extension points, manifests, and the registry tau-ui builds from them."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent = { workspace = true, features = ["serde"] }
tau-store.workspace = true
tau-ui-kit.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
hegeltest.workspace = true
