[package]
autotests = false
name = "heiko-ui-remote"
description = "heiko's interface: the workspace, its screens and the plugins' views, and the phone's remote that drives it from a computer's heiko."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
base64.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
hegeltest.workspace = true
tempfile.workspace = true
# Every plugin, for the tests that draw them.
heiko-plugins.workspace = true
heiko-chatgpt = { path = "../plugins/heiko-chatgpt", default-features = false }
heiko-codemode.workspace = true
heiko-luau-plugins.workspace = true
heiko-tools.workspace = true
heiko-vcs.workspace = true
heiko-agents.workspace = true

[dependencies]
base64.workspace = true
sha2.workspace = true
statig.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7" }
serde.workspace = true
serde_json.workspace = true
heiko-agent = { workspace = true, features = ["serde"] }
heiko-ai.workspace = true
heiko-perf.workspace = true
heiko-remote.workspace = true
heiko-store.workspace = true
# Draws the view tree's terminals.
heiko-terminal.workspace = true
heiko-ui-kit.workspace = true
heiko-ui-plugin.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[[test]]
name = "tests"
path = "tests/main.rs"
