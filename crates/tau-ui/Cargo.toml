[package]
name = "tau-ui"
description = "A GPUI desktop and phone-width interface for tau agents."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
hegeltest.workspace = true
tau-testing.workspace = true
tokio-util.workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
async-trait.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent = { workspace = true, features = ["serde"] }
tau-ai.workspace = true
tau-codemode.workspace = true
tau-compaction.workspace = true
tau-constitution = { workspace = true, features = ["demo"] }
tau-ask.workspace = true
tau-goal = { workspace = true, features = ["demo"] }
tau-jev.workspace = true
tau-mcp = { workspace = true, features = ["demo"] }
tau-memory = { workspace = true, features = ["docbert", "demo"] }
tau-reasoning.workspace = true
tau-remote.workspace = true
tau-fast-compaction.workspace = true
tau-store.workspace = true
# The product shows `bash` output as a terminal: commands run under a
# pseudo-terminal (docs/decisions/0010-terminal-rendering.md).
tau-tools = { workspace = true, features = ["terminal"] }
tau-artifacts.workspace = true
tau-vcs.workspace = true
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
# The interface it drives.
tau-ui-remote.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
reqwest.workspace = true
anyhow.workspace = true
uuid.workspace = true
if-addrs.workspace = true
libc.workspace = true
# Where the demo's plugins keep their files.
tempfile.workspace = true

# The desktop's windows. A phone build brings its own platform
# (gpui-pre-mobile), and this crate has none for Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = [
  "wayland",
  "x11",
  "font-kit",
] }

# Reads whether the desktop animates, through the settings portal;
# GPUI's Linux backend already builds it with these features.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd = { version = "0.13", default-features = false, features = [
  "async-io",
  "settings",
] }
