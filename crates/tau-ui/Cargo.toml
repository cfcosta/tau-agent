[package]
name = "tau-ui"
description = "tau on the computer: the host that runs agents behind tau-ui-remote's interface, and the server for paired phones."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
# The app's plugins, every host half included, for the demo's tests.
tau.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
hegeltest.workspace = true
tau-testing.workspace = true
tokio-util.workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
async-trait.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent = { workspace = true, features = ["serde"] }
tau-ai.workspace = true
tau-codemode.workspace = true
tau-compaction.workspace = true
tau-constitution.workspace = true
tau-constitution-host = { workspace = true, features = ["demo"] }
tau-ask.workspace = true
tau-skills = { workspace = true, features = ["demo"] }
tau-direnv.workspace = true
tau-goal = { workspace = true, features = ["demo"] }
tau-luau-plugins.workspace = true
tau-jev.workspace = true
tau-mcp = { workspace = true, features = ["demo"] }
tau-mcp-host.workspace = true
tau-memory.workspace = true
tau-watcher.workspace = true
tau-memory-host = { workspace = true, features = ["docbert", "demo"] }
tau-store-sqlite.workspace = true
tau-reasoning.workspace = true
tau-remote.workspace = true
tau-fast-compaction.workspace = true
tau-tree-compaction.workspace = true
tau-store.workspace = true
# The product shows `bash` output as a terminal: commands run under a
# pseudo-terminal (docs/decisions/0010-terminal-rendering.md).
tau-tools = { workspace = true, features = ["terminal"] }
tau-tools-host = { workspace = true, features = ["terminal"] }
tau-artifacts.workspace = true
tau-vcs.workspace = true
tau-vcs-host.workspace = true
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
# The interface it drives.
tau-ui-remote.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "time"] }
# A sub-agent's stop, as its plugins get it.
tokio-util.workspace = true
reqwest.workspace = true
anyhow.workspace = true
uuid.workspace = true
if-addrs.workspace = true
libc.workspace = true
# Where the demo's plugins keep their files.
tempfile.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# Desktop notifications over D-Bus, in Rust (zbus): no libdbus. GPUI's
# Linux backend already builds it with these features.
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
