[package]
name = "tau-ui"
description = "tau on the computer: the host that runs agents behind tau-ui-remote's interface, and mirrors it for the phones tau-phones pairs."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
# The demo's session, which tests drive the interface with.
tau-demo.workspace = true
image = { workspace = true, features = ["png"] }
# The app's plugins, every host half included, for the demo's tests.
tau.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
hegeltest.workspace = true
# Stores for tests; the host opens its own through tau-sqlite.
tau-store-sqlite.workspace = true
tau-testing.workspace = true
# The phone model's network: a proxy on the loopback.
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-util.workspace = true
# The plugins whose data and records the tests read.
tau-remote.workspace = true
tau-constitution.workspace = true
tau-github.workspace = true
tau-mcp.workspace = true
tau-memory.workspace = true
tau-vcs.workspace = true
# tau-todo's store, which its model reads.
tau-luau-plugins-host.workspace = true
tau-todo.workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
async-trait.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent = { workspace = true, features = ["serde"] }
tau-ai.workspace = true
tau-compaction.workspace = true
tau-constitution-host.workspace = true
tau-ask.workspace = true
tau-canvas.workspace = true
tau-skills.workspace = true
tau-direnv.workspace = true
tau-notify.workspace = true
tau-phones.workspace = true
tau-titles.workspace = true
tau-sqlite.workspace = true
tau-chatgpt.workspace = true
tau-compaction-chain.workspace = true
tau-schedule.workspace = true
tau-goal.workspace = true
tau-agents.workspace = true
tau-luau-plugins.workspace = true
tau-jev.workspace = true
tau-mcp-host.workspace = true
tau-watcher.workspace = true
tau-memory-host = { workspace = true, features = ["docbert"] }
tau-reasoning.workspace = true
tau-fast-compaction.workspace = true
tau-tree-compaction.workspace = true
tau-store.workspace = true
# The product shows `bash` output as a terminal: commands run under a
# pseudo-terminal (docs/decisions/0010-terminal-rendering.md).
tau-tools = { workspace = true, features = ["terminal"] }
tau-tools-host.workspace = true
tau-vcs-host.workspace = true
# GitHub: the forge slot's plugin, with its sign-in.
tau-github-host.workspace = true
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
# The interface it drives.
tau-ui-remote.workspace = true
# The plugins tau comes with.
tau-plugins.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "time"] }
# A sub-agent's stop, as its plugins get it.
tokio-util.workspace = true
anyhow.workspace = true
uuid.workspace = true
tempfile.workspace = true

