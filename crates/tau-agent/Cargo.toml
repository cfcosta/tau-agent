[package]
name = "tau-agent"
description = "Agents, runs, the agent loop, tools, plugins, limits, sub-agents and forks."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Serialize and deserialize run events, for interfaces that carry them
# over a wire (decision 0013).
serde = ["serde/rc"]
# What a loop is held to (`testing`): the runner's model, for any filler
# of `tau.loop` to check itself against.
testing = ["dep:hegeltest", "dep:tau-store-sqlite"]

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
tau-ai.workspace = true
tau-store.workspace = true
hegeltest = { workspace = true, optional = true }
tau-store-sqlite = { workspace = true, optional = true }

[dev-dependencies]
tau-agent = { workspace = true, features = ["testing"] }
tau-store-sqlite.workspace = true
tempfile.workspace = true
hegeltest.workspace = true
sqlx.workspace = true
tau-testing.workspace = true
trybuild.workspace = true
tokio = { workspace = true, features = ["rt"] }
