uuid.workspace = true
tau-ai.workspace = true
tau-store.workspace = true

[dev-dependencies]
tau-store-sqlite.workspace = true
tempfile.workspace = true
hegeltest.workspace = true
sqlx.workspace = true
tau-testing.workspace = true
trybuild.workspace = true
tokio = { workspace = true, features = ["rt"] }
