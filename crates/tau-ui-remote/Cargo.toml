[package]
name = "tau-ui-remote"
description = "tau's interface: the workspace, its screens and the plugins' views, and the phone's remote that drives it from a computer's tau."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
base64.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
hegeltest.workspace = true
tempfile.workspace = true
# Every plugin, for the tests that draw them.
tau-plugins.workspace = true
tau-codemode.workspace = true
tau-compaction.workspace = true
tau-constitution.workspace = true
tau-fast-compaction.workspace = true
tau-reasoning.workspace = true
tau-memory.workspace = true
tau-ask = { path = "../plugins/tau-ask", default-features = false }
tau-luau-plugins.workspace = true

[dependencies]
base64.workspace = true
sha2.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7" }
serde.workspace = true
serde_json.workspace = true
tau-agent = { workspace = true, features = ["serde"] }
tau-ai.workspace = true
tau-goal.workspace = true
tau-agents.workspace = true
tau-remote.workspace = true
tau-store.workspace = true
# `bash` cards draw their output as a terminal
# (docs/decisions/0010-terminal-rendering.md).
tau-tools = { workspace = true, features = ["terminal"] }
# Draws those commands' terminals.
tau-terminal.workspace = true
tau-vcs.workspace = true
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
anyhow.workspace = true
