[package]
name = "tau-ui-remote"
description = "tau's interface: the workspace, its screens and the plugins' views, and the phone's remote that drives it from a computer's tau."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
base64.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
hegeltest.workspace = true
tempfile.workspace = true

# The plugins come without their host halves: those are crates of
# their own (`tau-*-host`, ADR 0030), or the `host` feature of the
# plugins that keep theirs in the same crate. What runs agents is
# tau-ui's, and a phone runs none. Cargo cannot turn a workspace
# dependency's defaults off, so those name their paths.
[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
serde.workspace = true
serde_json.workspace = true
tau-agent = { workspace = true, features = ["serde"] }
tau-ai.workspace = true
tau-codemode.workspace = true
tau-compaction.workspace = true
tau-constitution.workspace = true
tau-ask = { path = "../plugins/tau-ask", default-features = false }
tau-direnv = { path = "../plugins/tau-direnv", default-features = false }
tau-goal.workspace = true
tau-watcher.workspace = true
tau-luau-plugins.workspace = true
tau-skills = { path = "../plugins/tau-skills", default-features = false }
tau-mcp.workspace = true
tau-memory.workspace = true
tau-reasoning.workspace = true
tau-remote.workspace = true
tau-fast-compaction.workspace = true
tau-tree-compaction.workspace = true
tau-store.workspace = true
# `bash` cards draw their output as a terminal
# (docs/decisions/0010-terminal-rendering.md).
tau-tools = { workspace = true, features = ["terminal"] }
# Draws those commands' terminals.
tau-terminal.workspace = true
tau-vcs.workspace = true
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
anyhow.workspace = true
