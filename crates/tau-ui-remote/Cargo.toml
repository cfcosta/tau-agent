[package]
name = "tau-ui-remote"
description = "tau's interface: the workspace, its screens and the plugins' views, and the phone's remote that drives it from a computer's tau."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
hegeltest.workspace = true
tau-testing.workspace = true
tempfile.workspace = true

# The plugins come without their host halves (each one's `host`
# feature): what runs agents is tau-ui's, and a phone runs none. Cargo
# cannot turn a workspace dependency's defaults off, so these name
# their paths.
[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent = { workspace = true, features = ["serde"] }
tau-ai.workspace = true
tau-codemode = { path = "../plugins/tau-codemode", default-features = false }
tau-compaction.workspace = true
tau-constitution.workspace = true
tau-ask = { path = "../plugins/tau-ask", default-features = false }
tau-direnv = { path = "../plugins/tau-direnv", default-features = false }
tau-goal.workspace = true
tau-luau-plugins = { path = "../plugins/tau-luau-plugins", default-features = false }
tau-skills = { path = "../plugins/tau-skills", default-features = false }
tau-mcp = { path = "../plugins/tau-mcp", default-features = false }
tau-memory.workspace = true
tau-reasoning.workspace = true
tau-remote.workspace = true
tau-fast-compaction.workspace = true
tau-store.workspace = true
# `bash` cards draw their output as a terminal
# (docs/decisions/0010-terminal-rendering.md).
tau-tools = { path = "../plugins/tau-tools", default-features = false, features = [
  "terminal",
] }
# Draws those commands' terminals.
tau-terminal.workspace = true
tau-vcs = { path = "../plugins/tau-vcs", default-features = false }
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
anyhow.workspace = true
