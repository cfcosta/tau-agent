[package]
name = "heiko-built-in-tests"
description = "The tests of heiko's built-in Luau plugins that need Rust, in one crate and one binary (ADR 0051)."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "built_in"
path = "tests/main.rs"

# A test a built-in package, listed when asked: libtest's harness names
# its tests as written, so this binary has its own `main`.
[[test]]
name = "packages"
path = "tests/packages.rs"
harness = false

[dev-dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
hegeltest.workspace = true
jsonschema.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
heiko-agent.workspace = true
heiko-ai.workspace = true
heiko-clock.workspace = true
heiko-codemode-host.workspace = true
heiko-jev.workspace = true
heiko-luau-plugins.workspace = true
heiko-luau-plugins-host.workspace = true
heiko-store.workspace = true
heiko-store-sqlite.workspace = true
heiko-testing.workspace = true
heiko-tools-host.workspace = true
heiko-ui-plugin.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }
tokio-util.workspace = true
