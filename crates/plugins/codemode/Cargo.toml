[package]
name = "tau-codemode"
description = "The codemode tool: a Luau sandbox that calls tau's tools and Jev, as a plugin."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7" }
mlua.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent.workspace = true
tau-ai.workspace = true
tau-jev.workspace = true
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util.workspace = true

[dev-dependencies]
tau-ui-plugin = { workspace = true, features = ["testing"] }
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
hegeltest.workspace = true
tau-store.workspace = true
tau-testing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
