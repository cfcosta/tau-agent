[package]
name = "tau-ask"
description = "Lets a tau agent ask the person structured questions and wait for the answers, as a plugin."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["host"]
# The agent half: the `ask` tool, which holds its call open until the
# answer comes. The state, its fold and the views build without it.
host = ["dep:async-trait", "dep:schemars", "dep:tokio"]

[dependencies]
anyhow.workspace = true
async-trait = { workspace = true, optional = true }
gpui = { package = "gpui-pre", version = "=0.3.7" }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tau-agent.workspace = true
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
tokio = { workspace = true, optional = true }
tracing = "0.1"

[dev-dependencies]
async-trait.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
futures-util.workspace = true
hegeltest.workspace = true
tau-ai.workspace = true
tau-store.workspace = true
tau-testing.workspace = true
tau-ui-plugin = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt", "time"] }
