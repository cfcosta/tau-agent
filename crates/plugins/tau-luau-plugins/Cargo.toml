[package]
name = "tau-luau-plugins"
description = "Plugins written in Luau, run in codemode's sandbox, as one tau plugin (ADR 0027)."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["host"]
# The agent half: loading plugins and running their hooks in Luau. The
# declarations, the view pieces and their drawing build without it, as
# on a phone.
host = [
  "dep:async-trait",
  "dep:sha2",
  "dep:tau-codemode",
  "dep:tau-vcs",
  "dep:tokio",
  "dep:tokio-util",
]

[dependencies]
anyhow.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7" }
async-trait = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tau-agent.workspace = true
tau-ai.workspace = true
tau-codemode = { workspace = true, optional = true }
tau-jev.workspace = true
# Where the skill tau ships is installed.
tau-skills = { path = "../tau-skills", default-features = false }
# Its UI (ADR 0017).
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
tau-vcs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
tau-vcs.workspace = true
tau-ui-plugin = { workspace = true, features = ["testing"] }
futures-util.workspace = true
tau-agent.workspace = true
tau-store.workspace = true
tau-testing.workspace = true
hegeltest.workspace = true
tau-codemode.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
