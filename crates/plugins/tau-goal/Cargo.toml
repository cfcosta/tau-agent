[package]
name = "tau-goal"
description = "Keeps a tau run going until a goal holds, checked with Jev, as a plugin."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The goals tau-ui's demo shows.
demo = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7" }
serde.workspace = true
serde_json.workspace = true
tau-agent.workspace = true
tau-ai.workspace = true
tau-jev.workspace = true
# Its UI (ADR 0017).
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true

[dev-dependencies]
tau-ui-plugin = { workspace = true, features = ["testing"] }
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
tau-store-sqlite.workspace = true
futures-util.workspace = true
hegeltest.workspace = true
schemars.workspace = true
tau-store.workspace = true
tau-testing.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }
