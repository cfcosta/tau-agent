[package]
name = "tau-mcp"
description = "tau-mcp's interface half: the Servers page, MCP tools' cards, and what they read."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The servers tau-ui's demo shows.
demo = []

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tau-agent.workspace = true
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
url = "2.5.8"

[dev-dependencies]
tau-ui-plugin = { workspace = true, features = ["testing"] }
hegeltest.workspace = true
regex.workspace = true
tempfile.workspace = true
