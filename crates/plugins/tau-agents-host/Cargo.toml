[package]
name = "tau-agents-host"
description = "tau-agents' host half: each agent's agent.luau read from its repository's trunk, its events queued and delivered to its conversation (ADR 0037)."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
# A websocket's binary messages reach `parse` in base64.
base64.workspace = true
futures-util.workspace = true
# Server-sent events, over tau's TLS.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent.workspace = true
tau-agents.workspace = true
# tau's TLS, which a `wss` stream dials through.
tau-ai.workspace = true
# An agent's folder is read, built and tested as a Luau plugin's is.
tau-luau-plugins-host.workspace = true
# Where the skill tau ships is installed.
tau-skills = { path = "../tau-skills", default-features = false }
# tau's secret store, which an agent's requests name keys from, and the
# grants its runs read artifacts by.
tau-tools-host.workspace = true
# Whose records those grants are.
tau-tools.workspace = true
# An event's data too large for its message.
tau-artifacts.workspace = true
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
tau-vcs-host.workspace = true
# What an `mcp` trigger read last, as a digest.
sha2.workspace = true
tokio = { workspace = true, features = ["net"] }
# Websocket streams.
tokio-tungstenite.workspace = true
tokio-util.workspace = true
# The host's offset from UTC, for schedules in its local time.
libc.workspace = true

[dev-dependencies]
tau-testing.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }
