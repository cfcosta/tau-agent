[package]
name = "tau-tools"
description = "tau-tools' interface half: the cards of its coding tools, and the shapes they read."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `exec_command` and `write_stdin` cards draw their output as the view
# tree's terminal, which the interface draws
# (docs/decisions/0010-terminal-rendering.md). Off, they show its last
# lines.
terminal = []

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent.workspace = true
uuid.workspace = true
tau-ai.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7" }
# Its UI (ADR 0017).
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true

[dev-dependencies]
tau-ui-plugin = { workspace = true, features = ["testing"] }
serde_json.workspace = true
hegeltest.workspace = true
