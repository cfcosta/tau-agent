[package]
name = "tau-tools"
description = "tau-tools' interface half: the cards of its coding tools, and the shapes they read."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `bash` cards draw their output as a terminal, with tau-terminal
# (libghostty-vt) (docs/decisions/0010-terminal-rendering.md). Off, they
# show its last lines, and neither is pulled in.
terminal = ["dep:tau-terminal"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent.workspace = true
uuid.workspace = true
tau-ai.workspace = true
tau-terminal = { workspace = true, optional = true }
thiserror.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7" }
# Its UI (ADR 0017).
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true

[dev-dependencies]
tau-ui-plugin = { workspace = true, features = ["testing"] }
serde_json.workspace = true
hegeltest.workspace = true
