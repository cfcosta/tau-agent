[package]
name = "tau-notify"
description = "Shows tau's notices on the desktop while its window is not in front, as a plugin filling the tau.notify slot."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["host"]
# The host half: the desktop's notification server, over D-Bus.
host = ["dep:notify-rust"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent.workspace = true
tau-ui-plugin.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# Desktop notifications over D-Bus, in Rust (zbus): no libdbus. GPUI's
# Linux backend already builds it with these features.
notify-rust = { version = "4.18", default-features = false, features = [
  "z",
], optional = true }
