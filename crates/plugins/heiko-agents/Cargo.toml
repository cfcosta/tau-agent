[package]
autotests = false
name = "heiko-agents"
description = "heiko-agents' interface half: agents, each a conversation that never ends in a repository of its own (ADR 0037)."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The default model for a new agent: the plan's newest small one.
heiko-ai.workspace = true
# An agent's tests come out as a Luau plugin's do.
heiko-luau-plugins.workspace = true
# A run's id, to open an agent's conversation.
heiko-agent.workspace = true
# Its UI (ADR 0017).
heiko-ui-kit.workspace = true
heiko-ui-plugin.workspace = true

[dev-dependencies]
hegeltest.workspace = true
regex.workspace = true
heiko-ui-plugin = { workspace = true, features = ["testing"] }

[[test]]
name = "tests"
path = "tests/main.rs"
