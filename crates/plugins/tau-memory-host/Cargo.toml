[package]
autotests = false
name = "tau-memory-host"
description = "Long-term memory for tau agents: a Zettelkasten of typed, linked Markdown notes; tau-memory's host half."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The notes tau-ui's demo shows.
demo = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent.workspace = true
tau-ai.workspace = true
tau-memory.workspace = true
thiserror.workspace = true
regex.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["rt"] }
toml.workspace = true
tau-ui-plugin.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tau-store.workspace = true
tau-store-sqlite.workspace = true
tau-ui-plugin = { workspace = true, features = ["testing"] }
hegeltest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
futures-util.workspace = true
tau-testing.workspace = true

[[test]]
name = "tests"
path = "tests/main.rs"
