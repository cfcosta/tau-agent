# The retrieval evaluation's corpus: facts about "harbor", a made-up job
# queue service in Rust, as a coding agent's memory would hold them.
#
# Each fact is a template over a subject and a value. The note that
# answers its queries fills in `subject` and `value`; its near-duplicates
# keep the wording and fill in one of `subjects` with one of `values`,
# and the first of them is the same subject with `old_value`, the older
# version the answer supersedes. `{subject_id}` is the subject as an
# identifier: `webhook worker` is `webhook_worker`.
#
# Queries, by how far their words are from the answer's:
# - `verbatim` shares identifiers, paths or phrases with it;
# - `paraphrase` means the same in other words, naming the subject by
#   what it does rather than what it is called;
# - `indirect` is worded like this fact but answered by the fact it
#   links to (`link`), which only a hop along the link reaches.
#
# Titles start with what tells near-duplicates apart: note ids are cut
# at 64 characters.
#
# Background notes (`[[background]]`, at the end) answer no query: they
# fill every level to the same size, so what changes from one level to
# the next is how many near-duplicates each answer has, not how many
# notes there are.

