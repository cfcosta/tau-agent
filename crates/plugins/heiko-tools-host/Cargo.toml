[package]
autotests = false
name = "heiko-tools-host"
description = "Optional coding tools for heiko agents: read, exec_command, write_stdin, edit, write, grep, find and ls; heiko-tools' host half."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
globset.workspace = true
grep-regex.workspace = true
# `http`, an agent's requests (ADR 0037), with heiko's TLS.
reqwest.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
image.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
heiko-agent.workspace = true
heiko-artifacts.workspace = true
heiko-ai.workspace = true
heiko-terminal.workspace = true
heiko-tools.workspace = true
heiko-store.workspace = true
heiko-ui-plugin.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
tokio-util.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
heiko-store-sqlite.workspace = true
heiko-ui-plugin = { workspace = true, features = ["testing"] }
base64.workspace = true
serde_json.workspace = true
heiko-store.workspace = true
hegeltest.workspace = true
image.workspace = true
unicode-normalization.workspace = true
heiko-testing.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "test-util",
  "net",
  "macros",
] }
tokio-util.workspace = true
reqwest.workspace = true
regex.workspace = true

[[bench]]
name = "grep"
harness = false

[[test]]
name = "tests"
path = "tests/main.rs"
