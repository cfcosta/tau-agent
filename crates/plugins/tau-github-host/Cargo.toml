[package]
name = "tau-github-host"
description = "GitHub through tau's GitHub App: signing in, cloning, pushing and pull requests; tau-github's host half, which fills the tau.forge slot."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# Reads a Git URL in every form Git takes. gix builds only with a hash
# picked: SHA-1, as jj-lib's.
gix = { workspace = true, features = ["sha1"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tau-agent.workspace = true
tau-ai.workspace = true
tau-github.workspace = true
tau-ui-plugin.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }

[dev-dependencies]
hegeltest.workspace = true
serde_json.workspace = true
tau-store-sqlite.workspace = true
tau-testing.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
