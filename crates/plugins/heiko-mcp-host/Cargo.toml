[package]
autotests = false
name = "heiko-mcp-host"
description = "Connects a heiko agent to MCP servers and adds their tools: heiko-mcp's host half."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
statig.workspace = true
http = "1"
libc.workspace = true
reqwest.workspace = true
# The MCP client (docs/research/codemode-libraries.md). Its API moves
# between majors, so only `src/client.rs` touches it. No default
# features; reqwest's TLS is the workspace's `rustls-no-provider`.
rmcp = { version = "3.9.0", default-features = false, features = [
  # OAuth sign-in (docs/reference/mcp.md, "Signing in"). Not
  # `auth-client-credentials-jwt`: it pulls aws-lc-rs.
  "auth",
  "client",
  "reqwest-tls-no-provider",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The SSE event type in rmcp's `StreamableHttpClient`, which rmcp does
# not re-export; the version rmcp uses.
sse-stream = "0.2.6"
heiko-agent.workspace = true
heiko-mcp.workspace = true
heiko-ai.workspace = true
heiko-ui-plugin.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util.workspace = true
tracing = "0.1"
# `filter::Targets`, for the filter that keeps rmcp's sign-in debug logs
# out of every subscriber (`auth::secrets_filter`).
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "registry",
  "std",
] }
url = "2.5.8"

[dev-dependencies]
# An in-process MCP server over streamable HTTP (`tests/common/http.rs`).
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
heiko-ui-kit.workspace = true
heiko-ui-plugin = { workspace = true, features = ["testing"] }
hegeltest.workspace = true
mlua.workspace = true
tempfile.workspace = true
rmcp = { version = "3.9.0", default-features = false, features = [
  "client",
  "macros",
  "server",
  "transport-io",
  "transport-streamable-http-server",
] }
heiko-codemode-host.workspace = true
heiko-store.workspace = true
heiko-store-sqlite.workspace = true
heiko-testing.workspace = true
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "time",
  "test-util",
  "net",
] }

# Runs itself as a stdio MCP server in a child process; libtest's output
# would corrupt the server's stdout, so it has its own `main`.
[[test]]
name = "stdio"
harness = false

[[test]]
name = "tests"
path = "tests/main.rs"
