[package]
autotests = false
name = "tau-luau-plugins-host"
description = "tau-luau-plugins' host half: loading plugins written in Luau and running their hooks in codemode's sandbox."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# The engine Luau property tests run on (ADR 0049).
hegeltest-c.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tau-agent.workspace = true
tau-ai.workspace = true
tau-codemode.workspace = true
tau-codemode-host.workspace = true
tau-jev.workspace = true
sqlx.workspace = true
tau-tools-host.workspace = true
# The host's local time, which `ctx.now` and `ctx.time` read (ADR 0050, gap D).
tau-clock.workspace = true
# The bytes of the files Luau plugins keep (`ctx.blobs`), and what
# images they are (`ctx.files.image`, ADR 0050 gap G).
tau-artifacts.workspace = true
image.workspace = true
base64.workspace = true
tau-luau-plugins.workspace = true
# Where the skill tau ships is installed.
tau-skills = { path = "../tau-skills", default-features = false }
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
tau-vcs-host.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["png"] }
hegeltest.workspace = true
tau-plugins.workspace = true
tau-store-sqlite.workspace = true
async-trait.workspace = true
tau-ui-plugin = { workspace = true, features = ["testing"] }
futures-util.workspace = true
tau-agent.workspace = true
tau-store.workspace = true
tau-testing.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "tests"
path = "tests/main.rs"
