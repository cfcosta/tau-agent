[package]
autotests = false
name = "tau-luau-plugins-host"
description = "tau-luau-plugins' host half: loading plugins written in Luau and running their hooks in codemode's sandbox."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# The engine Luau property tests run on (ADR 0049).
hegeltest-c.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `serde`: a loop test's events, as its check reads them (ADR 0053).
tau-agent = { workspace = true, features = ["serde"] }
tau-ai.workspace = true
tau-codemode.workspace = true
tau-codemode-host.workspace = true
tau-jev.workspace = true
sqlx.workspace = true
tau-tools-host.workspace = true
# The host's local time, which `ctx.now` and `ctx.time` read (ADR 0050, gap D).
tau-clock.workspace = true
# The bytes of the files Luau plugins keep (`ctx.blobs`), and what
# images they are (`ctx.files.image`, ADR 0050 gap G).
tau-artifacts.workspace = true
image.workspace = true
base64.workspace = true
# `ctx.files.frontmatter` (ADR 0050, gap K): a skill's descriptions are often
# YAML block scalars.
saphyr = { version = "0.2.2", default-features = false }
tau-luau-plugins.workspace = true
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
tau-vcs-host.workspace = true
# A forge's repository from a Git URL in any form Git takes.
gix.workspace = true
# `built_in::runtime`: tau-plugin and the app start one before anything else.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util.workspace = true
toml.workspace = true
# `t.loop` (ADR 0053): a real run, on a scripted model and a store in
# memory, in a folder of its own.
futures-util.workspace = true
tau-scripted.workspace = true
tau-store.workspace = true
tau-store-sqlite.workspace = true
tempfile.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# `ctx.desktop.notice`: desktop notifications over D-Bus, in Rust (zbus):
# no libdbus. GPUI's Linux backend already builds it with these features.
notify-rust = { version = "4.18", default-features = false, features = ["z"] }

[dev-dependencies]
image = { workspace = true, features = ["png"] }
hegeltest.workspace = true
tau-plugins.workspace = true
async-trait.workspace = true
tau-ui-plugin = { workspace = true, features = ["testing"] }
tau-agent.workspace = true
tau-testing.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "tests"
path = "tests/main.rs"
