[package]
name = "tau-codemode"
description = "Codemode's interface half: the cards of its Luau scripts, and the records they fold."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The cards show scripts formatted.
stylua.workspace = true
tau-agent = { workspace = true, features = ["serde"] }
tau-ai.workspace = true
tau-ui-kit.workspace = true
tau-ui-plugin.workspace = true
uuid.workspace = true

[dev-dependencies]
tau-ui-plugin = { workspace = true, features = ["testing"] }
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
hegeltest.workspace = true
