[package]
name = "tau-ai"
description = "OpenAI Responses over WebSocket: types, events, connection pool, retry and cost."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
futures-util.workspace = true
getrandom = "0.4.3"
httparse = "1.10.1"
sha2 = "0.11.0"
url = "2.5.8"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
hegeltest.workspace = true
tau-testing.workspace = true
turmoil.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[[bench]]
name = "transport"
harness = false

[[bench]]
name = "input"
harness = false
