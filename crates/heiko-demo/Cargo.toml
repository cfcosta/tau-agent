[package]
name = "heiko-demo"
description = "heiko's demo: a scripted session over the real interface and the plugins' host halves, for screenshots and tests."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.7" }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "time"] }
heiko-agent = { workspace = true, features = ["serde"] }
heiko-ai.workspace = true
heiko-remote.workspace = true
heiko-store.workspace = true
heiko-ui.workspace = true
heiko-ui-kit.workspace = true
heiko-ui-plugin.workspace = true
heiko-ui-remote.workspace = true
# The plugins whose screens it shows, with their demo data.
heiko-agents.workspace = true
heiko-chatgpt.workspace = true
heiko-codemode.workspace = true
heiko-direnv.workspace = true
heiko-decide.workspace = true
heiko-luau-plugins.workspace = true
# Where the canvas keeps the demo's chart, as a call would.
heiko-luau-plugins-host.workspace = true
# heiko-github's secret store, as its sign-in leaves it.
heiko-tools-host.workspace = true
# The demo's chart, drawn as a PNG.
image = { workspace = true, features = ["png"] }
heiko-mcp = { workspace = true, features = ["demo"] }
heiko-mcp-host.workspace = true
heiko-phones.workspace = true
heiko-tools.workspace = true
heiko-vcs.workspace = true

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
