[workspace]
# Core crates, then plugins (docs/decisions/0006-plugin-crates.md).
members = ["crates/tau-*", "crates/plugins/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/cfcosta/tau-agent"
# Not published until a license is chosen.
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false, features = [
  "sink",
  "std",
] }
base64 = "0.23.1"
# Only for `gix::hash::Kind`, which jj-lib's init takes; the version
# jj-lib uses, so it adds nothing to the tree (tau-vcs).
gix = { version = "0.87.1", default-features = false }
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
hegeltest = "0.28"
ignore = "0.4.33"
libc = "0.2.189"
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "webp",
] }
jj-lib = "=0.45.1"
jsonschema = { version = "0.58.1", default-features = false }
pollster = "1.0.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
similar = "3.2.0"
serde_json = { version = "1.0.151", features = [
  "float_roundtrip",
  "preserve_order",
] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
trybuild = "1.0.121"
unicode-normalization = "0.1.25"
turmoil = "0.7.2"
uuid = { version = "1.26.1", features = ["v7"] }
webpki-roots = "1.0.9"
tokio-rustls = { version = "0.26.5", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "handshake",
] }
tokio-util = { version = "0.7.19", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tau-agent = { path = "crates/tau-agent", version = "0.1.0" }
tau-compaction = { path = "crates/plugins/compaction", version = "0.1.0" }
tau-constitution = { path = "crates/plugins/constitution", version = "0.1.0" }
tau-fast-compaction = { path = "crates/plugins/fast-compaction", version = "0.1.0" }
tau-jev = { path = "crates/plugins/jev", version = "0.1.0" }
tau-ai = { path = "crates/tau-ai", version = "0.1.0" }
tau-store = { path = "crates/tau-store", version = "0.1.0" }
tau-testing = { path = "crates/tau-testing", version = "0.1.0" }
tau-tools = { path = "crates/plugins/tools", version = "0.1.0" }
tau-vcs = { path = "crates/plugins/vcs", version = "0.1.0" }
