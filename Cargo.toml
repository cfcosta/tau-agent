[workspace]
# Core crates, then plugins (docs/decisions/0006-plugin-crates.md), then
# evaluations that run agents end to end. `crates/tau-terminal` stands
# alone: it depends on no other tau crate.
members = ["crates/tau-*", "crates/plugins/*", "crates/evals/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/cfcosta/tau-agent"
# Not published until a license is chosen.
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
candle-core = "0.11.0"
# docbert's ColBERT model, pinned: long-term memory searches with it
# (tau-memory's `docbert` feature).
docbert-pylate = { git = "https://github.com/cfcosta/docbert", rev = "3a8c760bd9906c8797794abb220406481fa8315f" }
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false, features = [
  "sink",
  "std",
] }
base64 = "0.23.1"
# tau-vcs's own git work: cloning a source and reading its blobs. Kept
# at the gix jj-lib builds on, so the two share one copy; move it only
# when jj-lib does.
gix = { version = "0.87.1", default-features = false }
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
hegeltest = { version = "0.48.1", features = ["serde_json", "static-engine"] }
# The computer's addresses a phone could reach it at (tau-ui's Phones).
if-addrs = "0.15.0"
ignore = "0.4.33"
# Syntax highlighting of code in cards and replies (tau-ui-kit's
# `syntax`): the parser, its highlighter and one grammar per language.
tree-sitter = "0.27.0"
tree-sitter-highlight = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-luau = "1.2.0"
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
libc = "0.2.189"
# Codemode's sandbox: Luau, run from tokio, with JSON values
# (docs/decisions/0018-codemode-and-mcp.md).
mlua = { version = "0.12.1", features = ["luau", "async", "send", "serde"] }
# Codemode's cards show scripts formatted; the library half, for Luau.
stylua = { version = "2.5.2", default-features = false, features = ["luau"] }
# The terminal emulator behind tau-terminal
# (docs/decisions/0010-terminal-rendering.md). The -sys crate finds the
# library through pkg-config (the flake's `libghostty-vt`), never git or
# Zig. Its version pins a Ghostty commit, and flake.nix's `ghostty`
# input must be at that commit: move the two together.
libghostty-vt = { version = "0.2.2", default-features = false }
libghostty-vt-sys = { version = "0.2.2", default-features = false, features = [
  "pkg-config",
] }
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "webp",
] }
jj-lib = "=0.45.1"
jsonschema = { version = "0.58.2", default-features = false }
pollster = "1.0.1"
# Model replies are CommonMark with GitHub's tables; only the parser, no
# HTML output (tau-ui).
pulldown-cmark = { version = "0.13.4", default-features = false }
# The pairing code, drawn as a QR code; only its matrix, no images.
qrcode = { version = "0.14.1", default-features = false }
regex = "1.13.1"
rustix = { version = "1.1.5", default-features = false, features = [
  "process",
  "pty",
  "std",
  "termios",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
similar = "3.2.0"
serde_json = { version = "1.0.151", features = [
  "float_roundtrip",
  "preserve_order",
  "raw_value",
] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
trybuild = "1.0.121"
unicode-normalization = "0.1.25"
turmoil = "0.7.2"
uuid = { version = "1.26.1", features = ["v7"] }
webpki-roots = "1.0.9"
# tau-remote: the host's self-signed certificate, its fingerprint, and
# the random pairing secrets and device tokens.
rcgen = { version = "0.14", default-features = false, features = [
  "crypto",
  "ring",
] }
sha2 = "0.11.0"
getrandom = "0.4.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "handshake",
] }
tokio-util = { version = "0.7.19", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tau-agent = { path = "crates/tau-agent", version = "0.1.0" }
tau-ask = { path = "crates/plugins/tau-ask", version = "0.1.0" }
tau-direnv = { path = "crates/plugins/tau-direnv", version = "0.1.0" }
tau-codemode = { path = "crates/plugins/tau-codemode", version = "0.1.0" }
tau-compaction = { path = "crates/plugins/tau-compaction", version = "0.1.0" }
tau-constitution = { path = "crates/plugins/tau-constitution", version = "0.1.0" }
tau-fast-compaction = { path = "crates/plugins/tau-fast-compaction", version = "0.1.0" }
tau-goal = { path = "crates/plugins/tau-goal", version = "0.1.0" }
tau-luau-plugins = { path = "crates/plugins/tau-luau-plugins", version = "0.1.0" }
tau-skills = { path = "crates/plugins/tau-skills", version = "0.1.0" }
tau-reasoning = { path = "crates/plugins/tau-reasoning", version = "0.1.0" }
tau-jev = { path = "crates/plugins/tau-jev", version = "0.1.0" }
tau-mcp = { path = "crates/plugins/tau-mcp", version = "0.1.0" }
tau-memory = { path = "crates/plugins/tau-memory", version = "0.1.0" }
tau-ai = { path = "crates/tau-ai", version = "0.1.0" }
tau-artifacts = { path = "crates/tau-artifacts", version = "0.1.0" }
tau-store = { path = "crates/tau-store", version = "0.1.0" }
tau-terminal = { path = "crates/tau-terminal", version = "0.1.0" }
tau-testing = { path = "crates/tau-testing", version = "0.1.0" }
tau-tools = { path = "crates/plugins/tau-tools", version = "0.1.0" }
tau-vcs = { path = "crates/plugins/tau-vcs", version = "0.1.0" }
tau-remote = { path = "crates/tau-remote", version = "0.1.0" }
tau-ui = { path = "crates/tau-ui", version = "0.1.0" }
tau-ui-kit = { path = "crates/tau-ui-kit", version = "0.1.0" }
tau-ui-plugin = { path = "crates/tau-ui-plugin", version = "0.1.0" }
tau-ui-remote = { path = "crates/tau-ui-remote", version = "0.1.0" }
