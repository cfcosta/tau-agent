[workspace]
# The app, core crates, then plugins (docs/decisions/0006-plugin-crates.md),
# then evaluations that run agents end to end. `crates/heiko-terminal`
# stands alone: it depends on no other heiko crate.
members = ["crates/heiko", "crates/heiko-*", "crates/plugins/*", "crates/evals/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/cfcosta/tau-agent"
license = "MIT"
# Not on crates.io: heiko is an app, and it depends on git crates.
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false, features = [
  "sink",
  "std",
] }
base64 = "0.23.1"
# heiko-vcs's own git work: cloning a source and reading its blobs. Kept
# at the gix jj-lib builds on, so the two share one copy; move it only
# when jj-lib does.
gix = { version = "0.90.0", default-features = false }
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
hegeltest = { version = "0.48.1", features = ["serde_json", "static-engine"] }
# hegel's engine, which Luau plugins' property tests drive (ADR 0049):
# the version hegeltest links.
hegeltest-c = "=0.44.1"
# The computer's addresses a phone could reach it at (heiko-ui's Phones).
if-addrs = "0.15.0"
ignore = "0.4.33"
# Syntax highlighting of code in cards and replies (heiko-ui-kit's
# `syntax`): the highlighter, which brings the parser, and one grammar
# per language.
tree-sitter-highlight = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-luau = "1.2.0"
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
libc = "0.2.189"
# Codemode's sandbox: Luau, run from tokio, with JSON values
# (docs/decisions/0018-codemode-and-mcp.md).
mlua = { version = "0.12.2", features = ["luau", "async", "send", "serde"] }
# Codemode's cards show scripts formatted; the library half, for Luau.
stylua = { version = "2.5.2", default-features = false, features = ["luau"] }
# The terminal emulator behind heiko-terminal
# (docs/decisions/0010-terminal-rendering.md). The -sys crate finds the
# library through pkg-config (the flake's `libghostty-vt`), never git or
# Zig. Its version pins a Ghostty commit, and flake.nix's `ghostty`
# input must be at that commit: move the two together.
libghostty-vt = { version = "0.2.2", default-features = false }
libghostty-vt-sys = { version = "0.2.2", default-features = false, features = [
  "pkg-config",
] }
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "webp",
] }
jj-lib = "=0.47.0"
# Where jj's config is, and the computer's and the person's names, found
# as jj-cli 0.47 finds them (heiko-vcs-host's `config`). The rng is
# jj-lib's, for the repository config ids it reads.
etcetera = "0.11.0"
rand = "0.10.1"
rand_chacha = "0.10.0"
whoami = { version = "2.1.3", default-features = false, features = ["std"] }
# The time a revset's dates count from, in jj-lib's own type
# (heiko-vcs-host's `revsets`); the version jj-lib builds with.
jiff = "0.2.37"
jsonschema = { version = "0.58.2", default-features = false }
pollster = "1.0.1"
# Model replies are CommonMark with GitHub's tables; only the parser, no
# HTML output (heiko-ui).
pulldown-cmark = { version = "0.13.4", default-features = false }
# The pairing code, drawn as a QR code; only its matrix, no images.
qrcode = { version = "0.14.1", default-features = false }
regex = "1.13.1"
rustix = { version = "1.1.5", default-features = false, features = [
  "process",
  "pty",
  "std",
  "termios",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
# Lifecycles that were flags made explicit: the states, the events each
# takes and where it goes.
statig = "0.4.1"
sqlx = { version = "0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
similar = "3.2.0"
serde_json = { version = "1.0.151", features = [
  "float_roundtrip",
  "preserve_order",
  "raw_value",
] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
trybuild = "1.0.121"
unicode-normalization = "0.1.25"
turmoil = "0.7.2"
uuid = { version = "1.26.1", features = ["v7"] }
webpki-roots = "1.0.9"
# heiko-remote: the host's self-signed certificate, its fingerprint, and
# the random pairing secrets and device tokens.
rcgen = { version = "0.14", default-features = false, features = [
  "crypto",
  "ring",
] }
sha2 = "0.11.0"
getrandom = "0.4.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "handshake",
] }
tokio-util = { version = "0.7.19", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
heiko-agent = { path = "crates/heiko-agent", version = "0.1.0" }
heiko-direnv = { path = "crates/plugins/heiko-direnv", version = "0.1.0" }
heiko-phones = { path = "crates/plugins/heiko-phones", version = "0.1.0" }
heiko-sqlite = { path = "crates/plugins/heiko-sqlite", version = "0.1.0" }
heiko-chatgpt = { path = "crates/plugins/heiko-chatgpt", version = "0.1.0" }
heiko-codemode = { path = "crates/plugins/heiko-codemode", version = "0.1.0" }
heiko-codemode-host = { path = "crates/plugins/heiko-codemode-host", version = "0.1.0" }
heiko-agents = { path = "crates/plugins/heiko-agents", version = "0.1.0" }
heiko-agents-host = { path = "crates/plugins/heiko-agents-host", version = "0.1.0" }
heiko-clock = { path = "crates/heiko-clock", version = "0.1.0" }
heiko-scripted = { path = "crates/heiko-scripted", version = "0.1.0" }
heiko-luau-plugins = { path = "crates/plugins/heiko-luau-plugins", version = "0.1.0" }
heiko-luau-plugins-host = { path = "crates/plugins/heiko-luau-plugins-host", version = "0.1.0" }
heiko-jev = { path = "crates/plugins/heiko-jev", version = "0.1.0" }
heiko-mcp = { path = "crates/plugins/heiko-mcp", version = "0.1.0" }
heiko-mcp-host = { path = "crates/plugins/heiko-mcp-host", version = "0.1.0" }
heiko-ai = { path = "crates/heiko-ai", version = "0.1.0" }
heiko-artifacts = { path = "crates/heiko-artifacts", version = "0.1.0" }
heiko-store = { path = "crates/heiko-store", version = "0.1.0" }
heiko-store-sqlite = { path = "crates/heiko-store-sqlite", version = "0.1.0" }
heiko-terminal = { path = "crates/heiko-terminal", version = "0.1.0" }
heiko-testing = { path = "crates/heiko-testing", version = "0.1.0" }
heiko-tools = { path = "crates/plugins/heiko-tools", version = "0.1.0" }
heiko-tools-host = { path = "crates/plugins/heiko-tools-host", version = "0.1.0" }
heiko-vcs = { path = "crates/plugins/heiko-vcs", version = "0.1.0" }
heiko-vcs-host = { path = "crates/plugins/heiko-vcs-host", version = "0.1.0" }
heiko-remote = { path = "crates/heiko-remote", version = "0.1.0" }
heiko = { path = "crates/heiko", version = "0.1.0" }
heiko-ui = { path = "crates/heiko-ui", version = "0.1.0" }
heiko-ui-kit = { path = "crates/heiko-ui-kit", version = "0.1.0" }
heiko-ui-plugin = { path = "crates/heiko-ui-plugin", version = "0.1.0" }
heiko-ui-remote = { path = "crates/heiko-ui-remote", version = "0.1.0" }
heiko-plugins = { path = "crates/heiko-plugins", version = "0.1.0" }
heiko-demo = { path = "crates/heiko-demo", version = "0.1.0" }
