# The Luau plugins heiko comes with (ADR 0051), in the order they are active.
# The compactions rewrite in this order, the first rewrite winning: fast
# pruning, then the tree, then the summary.
plugins = [
  "heiko-todo",
  "heiko-titles",
  "heiko-suggestions",
  "heiko-compaction-chain",
  "heiko-watcher",
  "heiko-reasoning",
  "heiko-goal",
  "heiko-constitution",
  "heiko-ask",
  "heiko-schedule",
  "heiko-skills",
  "heiko-github",
  "heiko-memory",
  "heiko-notify",
  "heiko-fast-compaction",
  "heiko-tree-compaction",
  "heiko-compaction",
]

# Packages whose files are parts of the `heiko` module every plugin
# requires (ADR 0058): tested as the plugins are, loaded as none.
libraries = ["heiko-std"]
