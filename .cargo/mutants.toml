# cargo-mutants configuration.
#
# `exclude_re` below lists mutants verified to be behaviorally
# equivalent to the unmutated code, so no test can ever kill them
# without a change to the code that would make it worse, not better.
# Each entry names the function and the reasoning; see
# `crates/tau-agent/src/validation.rs` for the code.

exclude_re = [
  # is_integer_number: `number.is_i64() || number.is_u64()` short-cuts
  # the (equivalent, slower) fallback `as_f64().fract() == 0.0` check
  # below it. For every integer-backed `serde_json::Number` the
  # fallback independently agrees (a value small enough for `f64` to
  # represent exactly converts losslessly, and one too large for `f64`
  # to represent exactly is, at that magnitude, always an integral
  # float — `f64` has no fractional precision left at either extreme).
  # So the fallback always returns the same answer the `||` would have
  # short-cut to, and replacing `||` with `&&` cannot change the
  # function's return value for any input.
  'replace \|\| with && in is_integer_number',

  # matches_json_type: the "array" and "object" arms. This predicate is
  # only read from one place, `coerce_with_json_schema`'s
  # `matches_union_member` check, which decides whether to *skip* the
  # primitive-coercion loop. `coerce_primitive_by_type` has no "object"
  # case at all (falls through unchanged for every input) and its
  # "array" case is a no-op on a value that is already an array — so
  # for both types, running the loop or skipping it produces the exact
  # same value. Deleting either arm can only change whether the loop
  # runs, never what it produces.
  'delete match arm "array" in matches_json_type',
  'delete match arm "object" in matches_json_type',

  # coerce_with_json_schema: `types.len() > 1` vs `>= 1`. For a
  # single-type schema (`len == 1`), the mutated condition only adds
  # the "does the value already match its one type" check as a second
  # gate on whether to skip the primitive-coercion loop. When the value
  # does not match, that check is false either way (nothing to skip).
  # When it does match, `coerce_primitive_by_type` is a no-op for a
  # value already of its target type (the invariant
  # `coercion_leaves_a_valid_value_unchanged` in
  # `tests/validation.rs` pins exactly this), so running the loop
  # anyway produces the same value as skipping it. Either way the
  # mutant cannot change the result.
  'replace > with >= in coerce_with_json_schema',

  # AgentTool::execution_mode: the default method returns
  # `ExecutionMode::Parallel`, which is also `ExecutionMode::default()`
  # (`crates/tau-agent/src/tool.rs`), so the mutant returns the same value.
  'replace AgentTool::execution_mode -> ExecutionMode with Default::default\(\)',

  # tau_tools_host::lock::lock: `retain(|_, weak| weak.strong_count() > 0)`
  # only forgets locks nobody holds, to keep the table small. `>= 0`
  # keeps every entry, dead ones included: the same locks are handed
  # out, the table just grows. No behaviour but memory changes.
  'replace > with >= in lock',

  # tau_tools_host::read::read_text: `kept.len() < keep_lines && kept_bytes
  # <= keep_bytes` only bounds how much of the file is held in memory.
  # It keeps one line or byte past what truncation can show, so keeping
  # more (`<=`, or a byte count that never grows) changes no output:
  # truncate_head cuts the same prefix either way.
  'replace < with <= in read_text',
  'replace \+= with \*= in read_text',
  'replace \+ with \* in read_text',

  # tau_tools_host::find::effective_pattern: whether a pattern that already
  # starts with `/` or `**/` gets a `**/` prefix anyway. For `**/x` the
  # prefix gives `**/**/x`, which globset matches exactly as `**/x`; a
  # pattern starting with `/` never matches a relative path, prefixed or
  # not. So `||` and `&&` there give the same matches.
  'replace \|\| with && in effective_pattern',

  # tau_tools_host::image::fit: `w > max` against `w >= max`. At exactly
  # 2000 the scaling branch computes `h * 2000 / 2000 = h` and sets the
  # side to 2000, which it already is: the same size either way.
  'replace > with >= in fit',

  # tau_tools_host::edit::apply_replacements_preserving_unchanged_lines:
  # whether replacements whose line ranges touch without overlapping
  # (`start_line < last.end_line` against `<=`) share a group. A group
  # rewrites exactly its lines, so two adjacent groups and one merged
  # group produce the same text.
  'replace < with <= in apply_replacements_preserving_unchanged_lines',

  # Accumulator::push_decoded: `self.tail.len() > self.max_rolling_bytes
  # * 2` decides only whether to *call* `trim_tail()`, whose own guard
  # (`trim_tail`, unaffected by this mutant) is `self.tail.len() <=
  # self.max_rolling_bytes`. Replacing `* 2` with `/ 2` lowers the outer
  # threshold to half of `max_rolling_bytes`, so `trim_tail()` gets
  # called earlier and more often — but every one of those extra calls
  # sees `tail.len() <= max_rolling_bytes` (it has not reached the real
  # `* 2` threshold yet) and returns without trimming. Trimming still
  # happens at exactly the same size, `max_rolling_bytes`, only decided
  # by `trim_tail`'s own check. The mutant adds redundant no-op calls,
  # never a different tail.
  'replace \* with / in Accumulator::push_decoded',

  # Accumulator::append: `self.total_raw_bytes += chunk.len()`.
  # `total_raw_bytes` is read only in `should_spill`'s first clause,
  # `self.total_raw_bytes > self.max_bytes`. Decoding never shrinks: a
  # valid byte copies through 1:1, and the shortest possible invalid
  # subsequence Rust's decoder ever reports (down to 1 raw byte) becomes
  # one 3-byte replacement character, so `total_decoded_bytes >=
  # total_raw_bytes` always. Whenever the raw-bytes clause would be
  # true, `should_spill`'s second clause (`total_decoded_bytes >
  # max_bytes`) already is too. Freezing `total_raw_bytes` at 0 (`*=`
  # never grows past `0 * n == 0`) can therefore never change
  # `should_spill`'s result.
  'replace \+= with \*= in Accumulator::append',

  # output::unique: the exact formula mixing the nanosecond clock, the
  # pid and the atomic counter into one number is not part of the
  # contract -- only that spill files get new names, which
  # `spill_files_are_new_private_and_named` checks (and `create_new`
  # enforces). Swapping `^` for `|` or `&`, or `<<` for `>>`, still
  # combines two values that change on every call (the clock and the
  # counter) into one that does too.
  'replace \^ with . in unique',
  'replace << with >> in unique',

  # Accumulator::trim_tail, `if start > 0` (bash.rs:546; not the `==`
  # and `<` mutants there, which `trim_tail_lands_on_the_next_char_
  # boundary` catches by asserting the flag on a cut that is *not*
  # after a newline). `trim_tail` only ever runs from `push_decoded`'s
  # `if self.tail.len() > self.max_rolling_bytes * 2`, past its own
  # first line's early return unless `self.tail.len() >
  # self.max_rolling_bytes`. Both hold only when `max_rolling_bytes >=
  # 1` (always true: built as `(max_bytes * 2).max(1)`), so at this
  # line `start = self.tail.len() - self.max_rolling_bytes` is always
  # strictly greater than `self.max_rolling_bytes`, i.e. at least 1,
  # before the boundary-search loop above it (which can only grow
  # `start` further) even runs. `start` is a `usize`, so `start >= 0`
  # is therefore true on every reachable input exactly when `start > 0`
  # is — the only way they could disagree, `start == 0`, never happens.
  'bash\.rs:546:.*replace > with >= in Accumulator::trim_tail',

  # Accumulator::snapshot, the `by` fallback's `self.total_decoded_bytes
  # > self.max_bytes` (bash.rs:419; not the outer `truncated` check at
  # :422, nor the `==` and `<` mutants of this same line, all of which
  # `truncated_is_strict_not_inclusive_of_the_limits` and
  # `snapshot_falls_back_to_bytes_when_the_window_looks_whole` catch):
  # this line only runs once `truncated` (:421-422) is already true and
  # `tail.by` (from running `truncate_tail` on the rolling *window*) is
  # `None`. If `truncated` became true through the lines clause alone
  # (`total_decoded_bytes <= max_bytes`), the window cannot have been
  # trimmed -- trimming needs `tail.len() > max_rolling_bytes * 2 >= 4 *
  # max_bytes`, impossible while total decoded bytes are still within
  # `max_bytes` -- so the window equals the full tail and
  # `truncate_tail` sees the same over-the-line-limit content the outer
  # check did, setting `tail.by` to `Some(Lines)`, never `None`. So
  # whenever this line actually runs, `total_decoded_bytes > max_bytes`
  # is already true from the outer check, and `>=` cannot disagree with
  # `>` on any reachable input.
  'bash\.rs:419:.*replace > with >= in Accumulator::snapshot',

  # The default bodies of `Plugin::tools` and the `PluginRun` seams that
  # return nothing (`on_event`, `finish`) already do nothing: replacing
  # them with `vec![]` or `()` is the same code. So is the default
  # `after_tool_result`, which already returns `Ok(())`.
  'plugin\.rs:.*replace Plugin::tools -> Vec<Arc<dyn AgentTool>> with vec!\[\]',
  'plugin\.rs:.*replace PluginRun::(on_event|finish) with \(\)',
  'plugin\.rs:.*replace PluginRun::after_tool_result -> Result<\(\), PluginError> with Ok\(\(\)\)',
  # Likewise the default `rewrite_context`, which already returns
  # `Ok(None)`.
  'plugin\.rs:.*replace PluginRun::rewrite_context -> anyhow::Result<Option<Rewrite>> with Ok\(None\)',

  # run_task starts `last_seq` at -1, "nothing stored". It is only read
  # when the run ends, and by then the run has stored its input (seq 0)
  # and at least one response (seq >= 1): every path to `RunResult`
  # persists both, and a failed write returns before reading it. So a
  # start of 1 gives the same `fetch_max` on every reachable path.
  'agent\.rs:.*delete - in run_task',
]
